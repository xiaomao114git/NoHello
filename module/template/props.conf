# ⚠️ 清洗原则 (基于反作弊交叉验证分析):
# 1. 不含 ro.hardware/ro.board.platform — GL_RENDERER(Adreno)/soc0/device-tree
#    无法模拟, SoC 属性与真实硬件矛盾 = 最强伪装信号
# 2. 不含 ro.build.version.sdk/release — Build.VERSION.SDK_INT/RELEASE 是框架
