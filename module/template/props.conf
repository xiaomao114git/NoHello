# 3. 不含 ro.system.build.*/ro.vendor.build.* — 捐献机是测试版固件
#    (dev-keys/eng.root 是标准 root 特征), 只保留主指纹 (release-keys)
# 4. 只模拟"弱属性": 品牌/型号/设备名/主指纹/安全状态 — TGPA 实测检测面

